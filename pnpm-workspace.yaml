allowBuilds:
  "@onderwijsin/loops-core": true
  "@tailwindcss/oxide": false
  esbuild: false
  sharp: true
  vue-demi: true

catalog:
  "@nuxt/image": 2.0.0
  "@changesets/cli": 2.31.1
  "@changesets/changelog-git": 0.2.1
  "@commitlint/cli": 21.2.1
  "@commitlint/config-conventional": 21.2.0
  "@nuxt/module-builder": 1.0.3
  "@nuxt/test-utils": 4.1.0
  "@vitest/coverage-v8": 4.1.10
  "@types/node": 26.1.2
  husky: 9.1.7
  lint-staged: 17.3.0
  nuxt: 4.5.2
  nuxt-schema-org: 6.2.8
  nuxt-site-config: 4.2.0
  "@nuxt/kit": 4.5.2
  "@nuxt/schema": 4.5.2
  "@nuxt/ui": 4.10.0
  "@pinia/nuxt": 1.0.1
  "@vueuse/core": 14.4.0
  "@vueuse/nuxt": 14.4.0
  "@nuxtjs/turnstile": 1.1.3
  pinia: 4.0.2
  pinia-plugin-persistedstate: 4.7.1
  "@onderwijsin/loops-core": 1.3.0
  "@tailwindcss/typography": 0.5.20
  oxfmt: 0.62.0
  pathe: 2.0.3
  oxlint: 1.77.0
  publint: 0.3.23
  typescript: 5.9.3
  unbuild: 3.6.1
  vitest: 4.1.10
  vue: 3.5.41
  vue-tsc: 3.3.9
  scule: 1.3.0
  simple-icons: 16.28.0
  tailwindcss: 4.3.3
  consola: 3.4.2
  tsup: 8.5.1
  defu: 6.1.7
  h3: 1.15.11
  nitropack: 2.13.4
  unstorage: 1.17.5
  ofetch: 1.5.1
  ufo: 1.6.4
  unctx: 2.5.0
  zod: 4.4.3
  "@iconify-json/lucide": 1.2.121

packages:
  - packages/*
  - modules/*
  - modules/*/playground
  - playgrounds/*

catalogMode: "strict"
cleanupUnusedCatalogs: true
saveExact: true
minimumReleaseAgeExclude:
  - "@onderwijsin/*"
  - nuxt-site-config-kit@4.2.0
  - nuxt-site-config@4.2.0
  - site-config-stack@4.2.0

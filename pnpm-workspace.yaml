allowBuilds:
  "@tailwindcss/oxide": false
  esbuild: false
  vue-demi: true

catalog:
  "@changesets/cli": 2.31.1
  "@commitlint/cli": 21.2.1
  "@commitlint/config-conventional": 21.2.0
  "@nuxt/module-builder": 1.0.3
  "@nuxt/test-utils": 4.1.0
  "@types/node": 26.1.2
  husky: 9.1.7
  lint-staged: 17.3.0
  nuxt: 4.5.1
  "@nuxt/kit": 4.5.1
  "@nuxt/schema": 4.5.1
  "@nuxt/ui": 4.10.0
  oxfmt: 0.62.0
  oxlint: 1.77.0
  publint: 0.3.23
  typescript: 5.9.3
  unbuild: 3.6.1
  vitest: 4.1.10
  vue: 3.5.41
  vue-tsc: 3.3.9
  scule: 1.3.0
  consola: 3.4.2
  tsup: 8.5.1

packages:
  - packages/*
  - modules/*
  - modules/*/playground
  - playgrounds/*

# shamefullyHoist: true
catalogMode: "strict"
cleanupUnusedCatalogs: true
saveExact: true
minimumReleaseAgeExclude:
  - "@vue/compiler-core@3.5.41"
  - "@vue/compiler-dom@3.5.41"
  - "@vue/compiler-sfc@3.5.41"
  - "@vue/compiler-ssr@3.5.41"
  - "@vue/reactivity@3.5.41"
  - "@vue/runtime-core@3.5.41"
  - "@vue/runtime-dom@3.5.41"
  - "@vue/server-renderer@3.5.41"
  - "@vue/shared@3.5.41"
  - tsx@4.23.7
  - vue@3.5.41

allowBuilds:
  "@onderwijsin/loops-core": true
  "@tailwindcss/oxide": false
  esbuild: false
  vue-demi: true

catalog:
  "@changesets/cli": 2.31.1
  "@changesets/changelog-git": 0.2.1
  "@commitlint/cli": 21.2.1
  "@commitlint/config-conventional": 21.2.0
  "@nuxt/module-builder": 1.0.3
  "@nuxt/test-utils": 4.1.0
  "@types/node": 26.1.2
  husky: 9.1.7
  lint-staged: 17.3.0
  nuxt: 4.5.1
  "@nuxt/kit": 4.5.1
  "@nuxt/schema": 4.5.1
  "@nuxt/ui": 4.10.0
  "@onderwijsin/loops-core": 1.2.0
  "@tailwindcss/typography": 0.5.20
  oxfmt: 0.62.0
  oxlint: 1.77.0
  publint: 0.3.23
  typescript: 5.9.3
  unbuild: 3.6.1
  vitest: 4.1.10
  vue: 3.5.40
  vue-tsc: 3.3.9
  scule: 1.3.0
  simple-icons: 16.28.0
  tailwindcss: 4.3.3
  consola: 3.4.2
  tsup: 8.5.1
  defu: 6.1.7
  zod: 4.4.3
  "@iconify-json/lucide": 1.2.121

packages:
  - packages/*
  - modules/*
  - modules/*/playground
  - playgrounds/*

catalogMode: "strict"
cleanupUnusedCatalogs: true
saveExact: true
minimumReleaseAgeExclude:
  - "@onderwijsin/*"

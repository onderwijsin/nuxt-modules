name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  changeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: node scripts/check-changeset.mjs $(git diff --name-only "origin/${{ github.base_ref }}...HEAD")

  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build:utils
      - run: pnpm dev:prepare
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm validate:packages
      - name: Validate packed modules
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          for package in modules/*/package.json; do
            name=$(node -p "require('./$package').name")
            archive=$(corepack pnpm --filter "$name" pack --pack-destination "$RUNNER_TEMP/packages" --json | node -e 'let s=""; process.stdin.on("data", c => s += c).on("end", () => process.stdout.write(JSON.parse(s).filename))')
            node scripts/check-packed-package.mjs "$archive"
            pnpm exec publint "$(dirname "$package")"
          done

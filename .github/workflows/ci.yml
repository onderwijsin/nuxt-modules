name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  code_quality:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:utils
      - run: pnpm dev:prepare
      - parallel:
          - name: Format check
            run: pnpm run format:check
          - name: Lint
            run: pnpm run lint
          - name: Typecheck
            run: pnpm run typecheck
          - name: Test
            run: pnpm run test

  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:utils
      - run: pnpm dev:prepare
      - run: pnpm build
      - name: Validate package metadata
        run: pnpm validate:packages
      - name: Validate packed package artifacts
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          for package in packages/*/package.json modules/*/package.json; do
            name=$(node -p "require('./$package').name")
            private=$(node -p "require('./$package').private === true")
            [ "$private" = "true" ] && continue
            archive=$(corepack pnpm --filter "$name" pack --pack-destination "$RUNNER_TEMP/packages" --json | node -e 'let s=""; process.stdin.on("data", c => s += c).on("end", () => process.stdout.write(JSON.parse(s).filename))')
            node scripts/check-packed-package.mjs "$archive"
            pnpm exec publint "$(dirname "$package")"
          done

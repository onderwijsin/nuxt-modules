name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  code-quality: write

env:
  HUSKY: 0

jobs:
  code_quality:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:utils
      - run: pnpm dev:prepare
      - parallel:
          - name: Format check
            run: pnpm run format:check
          - name: Lint
            run: pnpm run lint
          - name: Typecheck
            run: pnpm run typecheck
          - name: Test
            run: pnpm run test:coverage
      - name: Upload coverage report
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1
        with:
          file: coverage/cobertura-coverage.xml
          language: JavaScript
          label: code-coverage/vitest

  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:utils
      - run: pnpm dev:prepare
      - run: pnpm build
      - name: Validate package metadata
        run: pnpm validate:packages
      - name: Validate packed package artifacts
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          for package in packages/*/package.json modules/*/package.json; do
            name=$(node -p "require('./$package').name")
            private=$(node -p "require('./$package').private === true")
            [ "$private" = "true" ] && continue
            archive=$(corepack pnpm --filter "$name" pack --pack-destination "$RUNNER_TEMP/packages" --json | node -e 'let s=""; process.stdin.on("data", c => s += c).on("end", () => process.stdout.write(JSON.parse(s).filename))')
            node scripts/check-packed-package.mjs "$archive"
            pnpm exec publint "$(dirname "$package")"
          done

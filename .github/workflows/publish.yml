name: Publish release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  HUSKY: 0

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'changeset-release/main')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      releases: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || 'main' }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:utils
      - run: pnpm dev:prepare
      - run: pnpm build
      - run: pnpm validate:packages
      - name: Validate packed modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packages"
          for package in modules/*/package.json; do
            name=$(node -p "require('./$package').name")
            archive=$(pnpm --filter "$name" pack --pack-destination "$RUNNER_TEMP/packages" --json | node -e 'let s=""; process.stdin.on("data", c => s += c).on("end", () => process.stdout.write(JSON.parse(s).filename))')
            node scripts/check-packed-package.mjs "$archive"
            pnpm exec publint "$(dirname "$package")"
          done
      - name: Publish packages
        id: changesets
        uses: changesets/action@v1
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          publish: pnpm changeset:publish
          createGithubReleases: true
  notify-slack:
    name: Notify Slack about published packages
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.releases != '' && needs.publish.outputs.releases != '[]'
    uses: ./.github/workflows/slack-notification.yml
    with:
      releases: ${{ needs.publish.outputs.releases }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

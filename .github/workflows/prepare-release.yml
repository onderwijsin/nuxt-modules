name: Prepare release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  HUSKY: 0

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset:version
      - name: Create or update release pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset modules pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No release changes to publish."
            exit 0
          fi
          git switch -C release/packages
          git commit -m "chore: prepare package release"
          git push --force origin HEAD:release/packages

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          existing=$(curl --fail-with-body --silent --show-error "${api}/pulls?head=${GITHUB_REPOSITORY_OWNER}:release%2Fpackages&base=main&state=open" "${headers[@]}" | jq -r '.[0].number // empty')
          body='{"title":"chore: prepare package release","head":"release/packages","base":"main","body":"Automated Changesets release pull request. CI validates the release changes before merge."}'
          if [[ -n "${existing}" ]]; then
            curl --fail-with-body --silent --show-error -X PATCH "${api}/pulls/${existing}" "${headers[@]}" -H "Content-Type: application/json" -d "${body}"
          else
            curl --fail-with-body --silent --show-error -X POST "${api}/pulls" "${headers[@]}" -H "Content-Type: application/json" -d "${body}"
          fi

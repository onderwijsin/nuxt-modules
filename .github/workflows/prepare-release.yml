name: Prepare release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  HUSKY: 0

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create or update version pull request
        id: changesets
        uses: changesets/action@v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          commit: "chore: version packages"
          title: Publish new package versions
      - name: Label version pull request
        if: steps.changesets.outputs.pullRequestNumber != ''
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: Number('${{ steps.changesets.outputs.pullRequestNumber }}'),
              labels: ['automated', 'no-changeset'],
            })

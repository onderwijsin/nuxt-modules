name: Prepare release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm format:check
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm build
      - run: corepack pnpm validate:packages
      - run: corepack pnpm changeset:version
      - run: node scripts/prepare-release-packages.mjs
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: release/packages
          delete-branch: false
          title: "chore: prepare package release"
          commit-message: "chore: prepare package release"
          body: "Automated Changesets release pull request."
          labels: release
